name: deploy-pages
# বাংলা মন্তব্য: Cloudflare Pages স্বয়ংক্রিয় ডিপ্লয়মেন্ট পাইপলাইন
# main ব্রাঞ্চে কোড পুশ বা সিঙ্ক হওয়ামাত্রই স্বয়ংক্রিয়ভাবে বিল্ড হয়ে Cloudflare Pages-এ ডিপ্লয় হবে।
# manual rerun এর জন্য workflow_dispatch অন্তর্ভুক্ত রয়েছে।

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build Studio
        env:
          VITE_SUPREMEAI_API_URL: https://supremeai-api-ulw0.onrender.com
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=supremeai-studio --branch=main
