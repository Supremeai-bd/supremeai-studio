name: ci
# বাংলা মন্তব্য: Studio public CI — lint + typecheck (§14 gate: প্রাইভেট সোর্স ছাড়াই build হওয়া লাগবে)
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - name: typecheck
        run: pnpm typecheck
      - name: lint
        run: pnpm lint
