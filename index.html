<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Issue #1529 (LOW): the browser tab fell back to the default favicon on
         every surface that could not rasterize SVG (legacy browsers, iOS
         home-screen, some crawlers). A real multi-resolution favicon.ico and
         an apple-touch-icon now ship alongside the SVG mark. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Issue #1462: PWA installability — without a manifest link the browser
         never offers "Add to Home Screen". Icon paths point at files that
         actually exist in public/ (the referenced logo-*.png did not). -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0F172A" />
    <!--
      FE-05 (Issue #522): the <meta http-equiv="Content-Security-Policy"> tag was
      REMOVED. A meta CSP cannot express frame-ancestors, is bypassable by
      header-stripping proxies, and duplicated (and could drift from) the
      authoritative response header. The enforcing CSP now ships ONLY as a
      response header:
        - Vercel production  -> vercel.json headers block (same policy, minus
          the http://localhost:* / http://127.0.0.1:* connect-src entries,
          plus frame-ancestors 'none')
        - Docker/nginx build -> frontend/nginx.conf add_header
      Known debt (documented in the commit): script-src still needs
      'unsafe-eval' because @monaco-editor/react loads Monaco from the jsDelivr
      AMD loader (which evals) on the IDE pages; removing it requires the
      sandboxed-iframe refactor from the issue body.
    -->

    <!-- Primary Meta Tags -->
    <title>SupremeAI Studio — Universal Self-Learning AI Agent</title>
    <meta name="title" content="SupremeAI Studio — Universal Self-Learning AI Agent" />
    <meta name="description" content="Manage, test, and control your self-learning AI agents from a single, state-of-the-art console interface." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="//" />
    <meta property="og:title" content="SupremeAI Studio — Universal Self-Learning AI Agent" />
    <meta property="og:description" content="Manage, test, and control your self-learning AI agents from a single, state-of-the-art console interface." />
    <meta property="og:image" content="//og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="//" />
    <meta property="twitter:title" content="SupremeAI Studio — Universal Self-Learning AI Agent" />
    <meta property="twitter:description" content="Manage, test, and control your self-learning AI agents from a single, state-of-the-art console interface." />
    <meta property="twitter:image" content="//og-image.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/loader.css">
  </head>
  <body>
    <!-- SupremeAI Studio Client Active Core -->
    <div id="root">
      <div class="loader-container">
        <div class="logo-wrapper">
          <div class="pulse-glow"></div>
          <div class="spinner"></div>
        </div>
        <div class="loader-text">Loading SupremeAI...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- FINAL-TEST FIX: the service worker used to be registered twice (here and
         in main.tsx), causing double registration races on every load. The single
         canonical registration lives in main.tsx (guarded to PROD builds). -->
  </body>
</html>
